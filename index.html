<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinô - Aluno</title>
<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0b0f17;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.12);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri-gradient: linear-gradient(135deg, #ff6a1a 0%, #ff3b00 100%);
  --pri-shadow: rgba(255, 106, 26, 0.35);
  --input-bg: rgba(255, 255, 255, 0.07);
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.4 system-ui, -apple-system, sans-serif;
  max-width: 500px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* CARD COM EFEITO DE VIDRO FOSCO (GLASSMORPHISM) */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  padding: 28px 24px;
  width: 100%;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

/* TÍTULO E BONEQUINHO ANIMADO */
h1 {
  font-size: 28px;
  margin: 0 0 24px;
  text-align: center;
  color: #ffffff;
  font-weight: 800;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.animado {
  display: inline-block;
  animation: pulsaBoneco 1.6s ease-in-out infinite;
}

@keyframes pulsaBoneco {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.25) rotate(-5deg); }
  100% { transform: scale(1); }
}

h2 {
  font-size: 18px;
  margin: 0 0 16px;
  text-align: center;
  color: #e2e8f0;
  font-weight: 600;
}

label {
  display: block;
  font-size: 13px;
  color: var(--mut);
  margin: 14px 0 6px;
  font-weight: 500;
}

/* INPUTS TRANSLÚCIDOS E ARREDONDADOS */
input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--card-border);
  border-radius: 16px;
  background: var(--input-bg);
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #ff6a1a;
  box-shadow: 0 0 12px var(--pri-shadow);
  background: rgba(255, 255, 255, 0.1);
}

input::placeholder {
  color: #64748b;
}

/* BOTÃO MODERNO COM DEGRADÊ E SOMBRA NEON */
.btn {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: 0;
  border-radius: 18px;
  background: var(--pri-gradient);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px var(--pri-shadow);
  transition: all 0.3s ease;
}

.btn:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px var(--pri-shadow);
}

.mut {
  color: var(--mut);
  font-size: 13px;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>
<body>

<div class="card">
  <h1><span class="animado">🏋️</span> Treinô</h1>
  <div id="app">
    <h2>Entrar como Aluno</h2>
    <label>Telefone (com DDD)</label>
    <input id="lt" type="tel" inputmode="tel" placeholder="11999998888">
    
    <label>Senha (6 dígitos)</label>
    <input id="ls" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">
    
    <button class="btn" onclick="entrarAluno()">Entrar</button>
    <div class="mut">Não possui acesso? Fale com seu instrutor.</div>
  </div>
</div>

<script>
// ===== CONFIGURAÇÃO DO SEU FIREBASE =====
const CFG = {
  apiKey: "AIzaSyCsidHGMxmF_OGqxZGeweUS6UCF_OViIvc",
  authDomain: "treino-app-787d7.firebaseapp.com",
  projectId: "treino-app-787d7",
  appId: "1:816237967715:web:96f923e22a8b4ed2e73b56"
};

firebase.initializeApp(CFG);
const auth = firebase.auth();
const db = firebase.firestore();

const fone = t => String(t || "").replace(/\D/g, "").slice(-11);
const em = ph => ph + "@academia.app";
const pwAluno6 = (ph, pin) => "Tn@" + ph + "#" + pin + "#treino26";
const $ = i => document.getElementById(i);

async function entrarAluno() {
  const ph = fone($("lt").value);
  const senha = $("ls").value;

  if (ph.length < 10) return alert("Digite o telefone com DDD válido.");
  if (!/^\d{6}$/.test(senha)) return alert("A senha precisa ter exatamente 6 números.");

  try {
    await auth.signInWithEmailAndPassword(em(ph), pwAluno6(ph, senha));
    
    const userDoc = await db.doc("users/" + auth.currentUser.uid).get();
    if (!userDoc.exists) {
      alert("Cadastro não encontrado no sistema. Fale com seu instrutor.");
      auth.signOut();
      return;
    }
    
    const userData = userDoc.data();
    if (userData.status !== "ativo") {
      alert("Sua conta está " + (userData.status || "bloqueada") + ". Fale com seu instrutor.");
      auth.signOut();
      return;
    }

    if (userData.role !== "aluno") {
      alert("Esta conta não é de aluno.");
      auth.signOut();
      return;
    }

    alert("Login realizado com sucesso! Redirecionando...");
    window.location.href = "aluno.html";
  } catch (e) {
    alert("Telefone ou senha incorretos. Verifique os dados.");
  }
}
</script>
</body>
</html>
