<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinô - Aluno</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff6a1a">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinô">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #0b0f17;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.12);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri-gradient: linear-gradient(135deg, #ff6a1a 0%, #ff3b00 100%);
  --pri-shadow: rgba(255, 106, 26, 0.35);
  --input-bg: rgba(255, 255, 255, 0.07);
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.4 system-ui, -apple-system, sans-serif;
  max-width: 500px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 28px;
  padding: 28px 24px;
  width: 100%;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

h1 {
  font-size: 28px;
  margin: 0 0 24px;
  text-align: center;
  color: #ffffff;
  font-weight: 800;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.animado {
  display: inline-block;
  animation: pulsaBoneco 1.6s ease-in-out infinite;
}

@keyframes pulsaBoneco {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.25) rotate(-5deg); }
  100% { transform: scale(1); }
}

h2 {
  font-size: 18px;
  margin: 0 0 16px;
  text-align: center;
  color: #e2e8f0;
  font-weight: 600;
}

label {
  display: block;
  font-size: 13px;
  color: var(--mut);
  margin: 14px 0 6px;
  font-weight: 500;
}

input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--card-border);
  border-radius: 16px;
  background: var(--input-bg);
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #ff6a1a;
  box-shadow: 0 0 12px var(--pri-shadow);
  background: rgba(255, 255, 255, 0.1);
}

input::placeholder { color: #64748b; }

.btn {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: 0;
  border-radius: 18px;
  background: var(--pri-gradient);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px var(--pri-shadow);
  transition: all 0.3s ease;
}

.btn:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px var(--pri-shadow);
}

.btn:disabled { opacity: 0.6; }

.btn-sec {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: none;
  margin-top: 12px;
}

.mut {
  color: var(--mut);
  font-size: 13px;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>
<body>

<div class="card">
  <h1><span class="animado">🏋️</span> Treinô</h1>
  <div id="app">
    <h2>Entrar como Aluno</h2>
    <label>Telefone (com DDD)</label>
    <input id="lt" type="tel" inputmode="tel" placeholder="11999998888">

    <label>Senha / PIN (4 a 6 números)</label>
    <input id="ls" type="password" inputmode="numeric" maxlength="6" placeholder="••••">

    <button class="btn" id="btnEntrar" onclick="entrarAluno()">Entrar</button>
    <button class="btn btn-sec" id="btnInstalar" style="display:none" onclick="instalarApp()">📲 Instalar app no celular</button>
    <div class="mut">Não possui acesso? Fale com seu instrutor.</div>
  </div>
</div>

<script>
// ===== PWA: service worker + botão de instalar =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW erro:', err));
  });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btnInstalar').style.display = 'block';
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('btnInstalar').style.display = 'none';
});

function instalarApp() {
  if (!deferredPrompt) {
    alert("Para instalar: toque nos 3 pontinhos do Chrome e escolha 'Instalar app' ou 'Adicionar à tela inicial'.");
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
}

// ===== FIREBASE =====
const CFG = {
  apiKey: "AIzaSyCsidHGMxmF_OGqxZGeweUS6UCF_OViIvc",
  authDomain: "treino-app-787d7.firebaseapp.com",
  projectId: "treino-app-787d7",
  appId: "1:816237967715:web:96f923e22a8b4ed2e73b56"
};

firebase.initializeApp(CFG);
const auth = firebase.auth();
const db = firebase.firestore();

const fone = t => String(t || "").replace(/\D/g, "").slice(-11);
const em = ph => ph + "@academia.app";
const pwAluno = (ph, pin) => "Tn@" + ph + "#" + pin + "#treino26";
const $ = i => document.getElementById(i);

// Se já estiver logado, valida a conta e vai direto pro painel
auth.onAuthStateChanged(async u => {
  if (!u) return;
  try {
    const snap = await db.doc("users/" + u.uid).get();
    if (!snap.exists) {
      alert("Cadastro não encontrado no sistema. Fale com seu instrutor.");
      return auth.signOut();
    }
    const d = snap.data();
    if (d.status && d.status !== "ativo") {
      alert("Sua conta está " + d.status + ". Fale com seu instrutor.");
      return auth.signOut();
    }
    if (d.role && d.role !== "aluno") {
      alert("Esta conta não é de aluno.");
      return auth.signOut();
    }
    window.location.replace("./aluno.html");
  } catch (e) {
    console.log(e);
    $("btnEntrar").disabled = false;
    $("btnEntrar").textContent = "Entrar";
    alert("Não foi possível carregar seu cadastro. Verifique a internet e tente de novo.");
  }
});

async function entrarAluno() {
  const ph = fone($("lt").value);
  const senha = $("ls").value.trim();

  if (ph.length < 10) return alert("Digite o telefone com DDD válido.");
  if (!/^\d{4,6}$/.test(senha)) return alert("A senha precisa ter de 4 a 6 números.");

  const btn = $("btnEntrar");
  btn.disabled = true;
  btn.textContent = "Entrando...";

  try {
    await auth.signInWithEmailAndPassword(em(ph), pwAluno(ph, senha));
    // o onAuthStateChanged acima faz a validação e o redirecionamento
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Entrar";
    alert("Telefone ou senha incorretos. Verifique os dados.");
  }
}
</script>
</body>
</html>
