:root {
  --bg: #0b0f17;

* { box-sizing: border-box; }
body {
  margin: 0 auto; background: var(--bg); color: var(--tx);

h1 { font-size: 22px; margin: 8px 0 16px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 800; }
nav { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: 1 0 auto; min-width: 58px; padding: 11px 8px; border: 1px solid var(--card-border); background: var(--card-bg);
  color: var(--mut); border-radius: 13px; font-size: 12px; font-weight: 700; cursor: pointer;
}
nav button.on { background: var(--pri-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 14px var(--pri-shadow); }
.card {
  background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border); border-radius: 22px; padding: 18px; margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
h2 { font-size: 18px; margin: 0 0 12px; color: #fff; font-weight: 700; }
h3 { font-size: 14px; margin: 14px 0 6px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
label { display: block; font-size: 13px; color: var(--mut); margin: 10px 0 4px; font-weight: 500; }
input, select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--card-border); border-radius: 12px;
  background: var(--input-bg); color: var(--tx); font-size: 15px; outline: none; transition: all .3s ease;
}
select option { background: #0b0f17; color: #fff; }
input:focus, select:focus { border-color: var(--pri); box-shadow: 0 0 10px var(--pri-shadow); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.btn {
  width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px;
  background: var(--pri-gradient); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 18px var(--pri-shadow); transition: all .2s ease;
}
.btn:active { transform: scale(.98); }
.btn.sec { background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: none; }
.btn.sm { width: auto; margin: 0; padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.lnk { background: none; border: 0; color: var(--pri); font-size: 14px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.mut { color: var(--mut); font-size: 13px; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--card-border); gap: 10px; }
.item:last-child { border-bottom: 0; }
.item.col { flex-direction: column; align-items: stretch; }
.check-box { width: 26px; height: 26px; accent-color: var(--pri); cursor: pointer; flex: none; }
.exok { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mut); }
.feito b { color: var(--ok); }
.bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; margin: 4px 0 10px; }
.bar > i { display: block; height: 100%; background: var(--pri-gradient); }
.bar.over > i { background: var(--no); }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.macros div { background: var(--input-bg); border-radius: 12px; padding: 8px 2px; }
.macros b { display: block; font-size: 16px; }
.macros span { font-size: 11px; color: var(--mut); }
.turbo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--pri); background: rgba(255,106,26,.08); margin-top: 12px; }
.turbo.on { background: var(--pri-gradient); border-color: transparent; }
.sw { position: relative; width: 50px; height: 28px; flex: none; margin: 0; }
.sw input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; padding: 0; z-index: 2; cursor: pointer; }
.sw i { position: absolute; inset: 0; background: rgba(255,255,255,.2); border-radius: 20px; transition: .2s; }
.sw i::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.sw input:checked + i { background: #fff; }
.sw input:checked + i::after { left: 25px; background: var(--pri); }
.res { background: var(--input-bg); border-radius: 14px; padding: 12px; margin-top: 10px; }
.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fotos figure { margin: 0; text-align: center; }
.fotos img { width: 100%; border-radius: 14px; aspect-ratio: 3/4; object-fit: cover; background: #111; }
.fotos figcaption { font-size: 12px; color: var(--mut); margin-top: 4px; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.thumbs img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
.modal { position: fixed; inset: 0; background: rgba(5,8,14,.92); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal .box { background: #121826; border: 1px solid var(--card-border); border-radius: 22px; max-width: 520px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; padding: 18px; }

auth.onAuthStateChanged(async u => {
  if (!u) { renderLogin(); return; }
  try { await carregarTudo(u); renderApp(); if (!(ME.lgpd && ME.lgpd.aceito)) mostrarLGPD(); }
  catch (e) {
    console.log(e);
    $("app").innerHTML = `<div class="card" style="margin-top:15vh;text-align:center;"><h2>Sem conexão</h2>
      <p class="mut">Não foi possível carregar seus dados. Verifique a internet.</p>
      <button class="btn" onclick="location.reload()">Tentar de novo</button></div>`;
  }
});

async function carregarTudo(u) {
  const s = await db.doc("users/" + u.uid).get();
  if (!s.exists) { alert("Cadastro não encontrado no sistema. Fale com seu instrutor."); auth.signOut(); throw new Error("sem cadastro"); }
  ME = { id: u.uid, ...s.data() };
  if (ME.status && ME.status !== "ativo") { alert("Sua conta está " + ME.status + ". Fale com seu instrutor."); auth.signOut(); throw new Error("inativo"); }

  const [tS, oS, pS, lS, dS] = await Promise.all([
    db.doc("treinos/" + ME.id).get(),
    db.doc("treinos_aluno/" + ME.id).get(),
    db.doc("plans/main").get().catch(() => null),
    db.doc("logs/" + ME.id + "_" + today()).get(),
    db.doc("dietas/" + ME.id + "_" + today()).get()
  ]);

  TR = tS.exists ? tS.data() : {};
  OWN = oS.exists && Array.isArray(oS.data().lista) ? oS.data().lista : [];
  LOG = { done: [], loads: {}, detalhe: {} };
  if (lS.exists) { const d = lS.data(); LOG = { ...d, done: Array.isArray(d.done) ? d.done : [], loads: d.loads || {}, detalhe: d.detalhe || {} }; }
  DIET = { itens: [] };
  if (dS.exists && Array.isArray(dS.data().itens)) DIET.itens = dS.data().itens;

  // Biblioteca de exercícios do instrutor
  const lib = [], vistos = new Set();
  const add = x => {
    const n = x && (x.n || x.nome); if (!n) return;
    const k = String(n).toLowerCase().trim(); if (vistos.has(k)) return; vistos.add(k);
    lib.push({ n, g: x.g || x.grupo || "Geral", gif: x.gif || "" });
  };
  Object.keys(BIBLIOTECA_G).forEach(g => BIBLIOTECA_G[g].split("|").forEach(n => add({ n, g })));
  const plan = (pS && pS.exists) ? pS.data() : {};
  Object.keys(plan).forEach(k => { if (Array.isArray(plan[k])) plan[k].forEach(add); });
  if (ME.instrutor) { try { const q = await db.collection("exercicios").where("instrutor", "==", ME.instrutor).get(); q.forEach(d => add(d.data())); } catch (e) {} }
  lib.sort((a, b) => a.g.localeCompare(b.g) || a.n.localeCompare(b.n));
  LIB = lib;
}

async function mudarTreino(t) {
  ME.hoje = t; renderApp();
  try { await db.doc("users/" + ME.id).update({ hoje: t }); } catch (e) { console.log(e); }
}

async function toggleEx(t, i) {
  const e = TR[t][i], id = e.id || (t + "_" + i);
  if (LOG.done.includes(id)) {
    LOG.done = LOG.done.filter(x => x !== id);
    delete LOG.detalhe[id];
  } else {
    LOG.done.push(id);
    LOG.detalhe[id] = { ts: Date.now(), treino: t, n: e.n, g: e.g || "", s: e.s || "", r: e.r || "", carga: e.carga || "", proprio: false };
  }
  renderApp();
  await salvarLog();
}

async function editCarga(t, i, val) {
  const e = TR[t][i], antes = e.carga || "";
  val = String(val).trim();
  if (val === antes) return;
  e.carga = val;
  const id = e.id || (t + "_" + i);
  LOG.loads[id] = val;
  if (LOG.detalhe[id]) LOG.detalhe[id].carga = val;
  try {
    await db.doc("treinos/" + ME.id).set({ [t]: TR[t] }, { merge: true });
    await salvarLog();
    if (num(val) > num(antes)) {
      await db.collection("alertas").add({
        uid: ME.id, instrutor: ME.instrutor || null, aluno: ME.nome || "", tipo: "carga", treino: t, exercicio: e.n,
        de: antes, para: val, ts: Date.now(), data: today(), lido: false
      });
      toast("Carga atualizada. Seu instrutor foi avisado do aumento.");
    } else toast("Carga atualizada.");
  } catch (err) { console.log(err); toast("Não foi possível salvar a carga."); }
}

function filtrarLib() {
  const nz = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const g = $("lg").value, qs = nz($("lq").value).split(/\s+/).filter(Boolean);
  LIBF = LIB.filter(x => (!g || x.g === g) && qs.every(w => nz(x.n + " " + x.g).includes(w))).slice(0, 80);
  $("libres").innerHTML = LIBF.length ? LIBF.map((x, i) => `
    <div class="item"><div><b>${esc(x.n)}</b><div class="mut">${esc(x.g)}</div></div>
    <button class="btn sm" onclick="addOwn(${i})">+ Add</button></div>`).join("") : '<div class="mut">Nenhum exercício encontrado.</div>';
}

async function saveOwn() {
  try { await db.doc("treinos_aluno/" + ME.id).set({ uid: ME.id, aluno: ME.nome || "", lista: OWN, ts: Date.now() }); }
  catch (e) { console.log(e); toast("Não foi possível salvar."); }
}
async function addOwn(i) {
  const x = LIBF[i]; if (!x) return;
  OWN.push({ id: "own_" + Date.now(), n: x.n, g: x.g, gif: x.gif, s: "3", r: "12", carga: "" });
  toast(x.n + " adicionado");
  renderApp(); await saveOwn();
}
async function editOwn(i, campo, val) {
  OWN[i][campo] = String(val).trim();
  const id = OWN[i].id;
  if (campo === "carga") { LOG.loads[id] = OWN[i].carga; if (LOG.detalhe[id]) LOG.detalhe[id].carga = OWN[i].carga; salvarLog(); }
  await saveOwn();
}
async function delOwn(i) {
  if (!confirm("Remover este exercício do seu treino?")) return;
  const id = OWN[i].id;
  OWN.splice(i, 1);
  LOG.done = LOG.done.filter(x => x !== id); delete LOG.detalhe[id];
  renderApp(); await saveOwn(); salvarLog();
}
async function toggleOwn(i) {
  const e = OWN[i], id = e.id;
  if (LOG.done.includes(id)) { LOG.done = LOG.done.filter(x => x !== id); delete LOG.detalhe[id]; }
  else {
    LOG.done.push(id);
    LOG.detalhe[id] = { ts: Date.now(), treino: "Próprio", n: e.n, g: e.g || "", s: e.s || "", r: e.r || "", carga: e.carga || "", proprio: true };
  }
  renderApp(); await salvarLog();
}

// ===== DIETA: META + CALCULADORA =====
function calcMeta() {
  const peso = num(ME.peso), alt = num(ME.alt), idade = num(ME.idade);
  if (!peso || !alt || !idade) return null;
  const masc = (ME.sexo || "m") === "m";
  const tmb = 10 * peso + 6.25 * alt - 5 * idade + (masc ? 5 : -161);
  const d = num(ME.dias) || 4;
  const fat = d <= 1 ? 1.2 : d <= 3 ? 1.375 : d <= 5 ? 1.55 : 1.725;
  const get = tmb * fat;
  const perder = ME.obj !== "ganhar";
  const kcal = perder ? get * 0.8 : get * 1.15;
  const p = peso * 2, f = peso * (perder ? 0.9 : 1);
  const c = Math.max(0, (kcal - p * 4 - f * 9) / 4);
  const mult = ME.turbo ? 1.2 : 1;
  return { tmb: Math.round(tmb), get: Math.round(get), kcal: Math.round(kcal * mult), p: Math.round(p * mult), c: Math.round(c * mult), f: Math.round(f * mult), perder, turbo: !!ME.turbo };
}

function totaisDia() {
  return DIET.itens.reduce((a, x) => ({ k: a.k + x.k, p: a.p + x.p, c: a.c + x.c, f: a.f + x.f }), { k: 0, p: 0, c: 0, f: 0 });
}

function barra(rot, v, meta, un) {
  const pc = meta ? Math.min(100, v / meta * 100) : 0, over = meta && v > meta;
  return `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${rot}</span><span><b>${Math.round(v)}</b> / ${meta}${un}</span></div>
    <div class="bar ${over ? "over" : ""}"><i style="width:${pc}%"></i></div>`;
}

async function setTurbo(on) {

function filtrarAlim(manter) {
  const q = ($("fq") ? $("fq").value : "").trim();
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const nq = norm(q);
  DFIL = [];
  FOODS.forEach((f, i) => { if (!nq || norm(f[0]).includes(nq)) DFIL.push(i); });
  if (!manter) DSEL = -1;
  const lista = DFIL.slice(0, 60);
  $("fres").innerHTML = lista.map(i => {
    const f = FOODS[i];
    return `<div class="item" style="cursor:pointer;padding:9px 4px" onclick="selAlim(${i})"><div><b style="font-size:14px">${esc(f[0])}</b>
      <div class="mut">${f[1]} kcal · P ${f[2]} · C ${f[3]} · G ${f[4]}</div></div><span style="color:var(--pri)">›</span></div>`;
  }).join("") || '<div class="mut" style="padding:8px">Nenhum alimento encontrado.</div>';
  if (DSEL >= 0) mostrarSel();
  else $("fsel").innerHTML = "";
}

function selAlim(i) { DSEL = i; mostrarSel(); $("fsel").scrollIntoView({ behavior: "smooth", block: "center" }); }

function mostrarSel() {
  const f = FOODS[DSEL];
  $("fsel").innerHTML = `
    <div class="res">
      <b>${esc(f[0])}</b>
      <div class="row" style="margin-top:8px">
        <div><label style="margin-top:0">Quantidade (g)</label><input id="fg" type="number" inputmode="decimal" value="100" oninput="atualizarCalc()"></div>
        <div><label style="margin-top:0">Refeição</label><select id="fr"><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Jantar</option><option>Ceia</option></select></div>
      </div>
      <div class="macros" id="fcalc" style="margin-top:10px"></div>
      <button class="btn" onclick="addAlim()">Adicionar ao dia</button>
    </div>`;
  atualizarCalc();
}

function valoresSel() {
  const f = FOODS[DSEL], g = num($("fg").value), k = g / 100;
  return { n: f[0], g, k: f[1] * k, p: f[2] * k, c: f[3] * k, f: f[4] * k };
}
function atualizarCalc() {
  const v = valoresSel();
  $("fcalc").innerHTML = `<div><b>${Math.round(v.k)}</b><span>kcal</span></div><div><b>${r1(v.p)}g</b><span>proteína</span></div><div><b>${r1(v.c)}g</b><span>carbo</span></div><div><b>${r1(v.f)}g</b><span>gordura</span></div>`;
}

async function saveDiet() {
  try { await db.doc("dietas/" + ME.id + "_" + today()).set({ uid: ME.id, instrutor: ME.instrutor || null, aluno: ME.nome || "", date: today(), itens: DIET.itens, ts: Date.now() }); }

// ===== FOTOS DE COMPARAÇÃO (1 a cada 30 dias) =====
async function vFotos() {
  $("v").innerHTML = '<div class="card"><p class="mut">Carregando fotos...</p></div>';
  if (FOTOS === null) {
    try {
      const q = await db.collection("fotos").where("uid", "==", ME.id).get();
      FOTOS = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.ts - b.ts);
    } catch (e) { console.log(e); FOTOS = null; $("v").innerHTML = '<div class="card"><p class="mut">Não foi possível carregar as fotos. Verifique a internet.</p></div>'; return; }
  }
  const ult = FOTOS[FOTOS.length - 1];
  const dias = ult ? Math.floor((Date.now() - ult.ts) / 864e5) : 999;
  const pode = !ult || dias >= 30;
  const falta = 30 - dias;
  $("v").innerHTML = `
    <div class="card">
      <h2>Foto de evolução</h2>
      ${pode ? `
        <div class="mut">${ult ? "Já se passaram " + dias + " dias desde a última foto. Hora de enviar a nova!" : "Envie sua primeira foto. Ela será o ponto de partida da comparação."}</div>
        <label>Peso atual (kg) — opcional</label>
        <input id="fpeso" type="number" inputmode="decimal" step="0.1" value="${esc(ME.peso || "")}">
        <label>Foto (corpo inteiro, mesma pose e luz de sempre)</label>
        <input id="ffile" type="file" accept="image/*" onchange="enviarFoto(this)">
      ` : `<div class="mut">Próxima foto liberada em <b style="color:#fff">${falta} dia${falta > 1 ? "s" : ""}</b> (${dt(ult.ts + 30 * 864e5)}). É possível enviar uma foto a cada 30 dias.</div>`}
    </div>
    ${FOTOS.length ? `
    <div class="card">
      <h2>Comparação</h2>
      ${FOTOS.length > 1 ? `<div class="row">
        <div><label style="margin-top:0">Antes</label><select id="fa" onchange="atualizarComp()">${FOTOS.map((f, i) => `<option value="${i}" ${i === 0 ? "selected" : ""}>${dt(f.ts)}</option>`).join("")}</select></div>
        <div><label style="margin-top:0">Depois</label><select id="fb" onchange="atualizarComp()">${FOTOS.map((f, i) => `<option value="${i}" ${i === FOTOS.length - 1 ? "selected" : ""}>${dt(f.ts)}</option>`).join("")}</select></div>
      </div>` : '<div class="mut">Com a segunda foto a comparação aparece aqui.</div>'}
      <div id="comp" style="margin-top:10px"></div>
    </div>
    <div class="card"><h2>Histórico</h2><div class="thumbs">${FOTOS.map(f => `<div><img src="${f.img}" alt=""><div class="mut" style="font-size:11px;text-align:center">${dt(f.ts)}</div></div>`).join("")}</div></div>` : ""}`;
  if (FOTOS.length) atualizarComp();
}

function atualizarComp() {
  const a = FOTOS[$("fa") ? +$("fa").value : 0], b = FOTOS[$("fb") ? +$("fb").value : FOTOS.length - 1];
  const fig = (f, t) => `<figure><img src="${f.img}" alt=""><figcaption><b>${t}</b> · ${dt(f.ts)}${f.peso ? " · " + f.peso + " kg" : ""}</figcaption></figure>`;
  let dif = "";
  if (a !== b && a.peso && b.peso) { const d = r1(b.peso - a.peso); dif = `<div class="res" style="text-align:center">Variação de peso: <b>${d > 0 ? "+" : ""}${d} kg</b> em ${Math.max(0, Math.round((b.ts - a.ts) / 864e5))} dias</div>`; }
  $("comp").innerHTML = `<div class="fotos">${fig(a, "Antes")}${a === b ? "" : fig(b, "Depois")}</div>${dif}`;
}

function redimensionar(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const M = 720, k = Math.min(1, M / Math.max(im.width, im.height));
        const w = Math.round(im.width * k), h = Math.round(im.height * k);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        let q = 0.72, d = c.toDataURL("image/jpeg", q);
        while (d.length > 700000 && q > 0.3) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
        res(d);
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

async function enviarFoto(inp) {
  const file = inp.files && inp.files[0]; if (!file) return;
  const ult = FOTOS && FOTOS[FOTOS.length - 1];
  if (ult && Date.now() - ult.ts < 30 * 864e5) return toast("Ainda não passaram 30 dias.");
  toast("Enviando foto...");
  try {
    const img = await redimensionar(file);
    const peso = num($("fpeso").value) || null;
    const ts = Date.now();
    const doc = { uid: ME.id, instrutor: ME.instrutor || null, aluno: ME.nome || "", ts, data: today(), peso, img };
    const ref = await db.collection("fotos").add(doc);
    FOTOS.push({ id: ref.id, ...doc });
    toast("Foto enviada! ✅");
    vFotos();
  } catch (e) { console.log(e); toast("Erro ao enviar a foto. Tente de novo."); }
}

function mostrarLGPD(soVer) {
  if ($("lgpdm")) return;
  const m = document.createElement("div");
  m.className = "modal"; m.id = "lgpdm";
  m.innerHTML = `<div class="box">
    <h2 style="margin:0">🔒 Privacidade e proteção de dados</h2>
    <div class="txt">${LGPD_TXT}</div>
    ${soVer ? `<button class="btn" onclick="$('lgpdm').remove()">Fechar</button>` : `

  </div>`;
  document.body.appendChild(m);
}

async function aceitarLGPD() {
  const lgpd = { aceito: true, ts: Date.now(), versao: LGPD_VERSAO };
  try {
    await db.doc("users/" + ME.id).update({ lgpd });
    ME.lgpd = lgpd;
    $("lgpdm").remove();
    toast("Consentimento registrado. Obrigado!");

  } catch (e) { console.log(e); toast("Não foi possível registrar. Verifique a internet."); }

function exportarDados() {
  const perfil = { ...ME };
  const d = {

    treinoDoInstrutor: TR, treinoProprio: OWN, execucaoHoje: LOG, dietaHoje: DIET.itens,
    fotos: (FOTOS || []).map(f => ({ data: f.data, peso: f.peso }))
  };
  const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "meus-dados-treino.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);

}
