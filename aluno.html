<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinô - Painel do Aluno</title>

<!-- PWA Manifest & Theme -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff6a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #0b0f17;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.12);
  --tx: #f8fafc;
  --mut: #94a3b8;
  --pri: #ff6a1a;
  --pri-gradient: linear-gradient(135deg, #ff6a1a 0%, #ff3b00 100%);
  --pri-shadow: rgba(255, 106, 26, 0.35);
  --input-bg: rgba(255, 255, 255, 0.07);
  --ok: #22c55e;
  --no: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.4 system-ui, -apple-system, sans-serif;
  max-width: 550px;
  padding: 16px 16px 60px;
  min-height: 100vh;
}

h1 {
  font-size: 22px;
  margin: 8px 0 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #fff;
  font-weight: 800;
}

nav {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

nav button {
  flex: 1;
  padding: 12px 6px;
  border: 1px solid var(--card-border);
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--mut);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

nav button.on {
  background: var(--pri-gradient);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px var(--pri-shadow);
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

h2 { font-size: 18px; margin: 0 0 12px; color: #fff; font-weight: 700; }
label { display: block; font-size: 13px; color: var(--mut); margin: 10px 0 4px; font-weight: 500; }

input, select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--input-bg);
  color: var(--tx);
  font-size: 15px;
  outline: none;
  transition: all 0.3s ease;
}

select option { background: #0b0f17; color: #fff; }

input:focus, select:focus {
  border-color: var(--pri);
  box-shadow: 0 0 10px var(--pri-shadow);
}

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.btn {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: var(--pri-gradient);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px var(--pri-shadow);
  transition: all 0.2s ease;
}

.btn:active { transform: scale(0.98); }

.lnk {
  background: none;
  border: 0;
  color: var(--pri);
  font-size: 14px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
}

.mut { color: var(--mut); font-size: 13px; }

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 10px;
  border-bottom: 1px solid var(--card-border);
  gap: 10px;
}

.item:last-child { border-bottom: 0; }

.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: #fff;
}

.check-box {
  width: 24px;
  height: 24px;
  accent-color: var(--pri);
  cursor: pointer;
}
</style>
</head>
<body>

<div id="app"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erro: ', err));
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

const CFG = {
  apiKey: "AIzaSyCsidHGMxmF_OGqxZGeweUS6UCF_OViIvc",
  authDomain: "treino-app-787d7.firebaseapp.com",
  projectId: "treino-app-787d7",
  appId: "1:816237967715:web:96f923e22a8b4ed2e73b56"
};

firebase.initializeApp(CFG);
const auth = firebase.auth();
const db = firebase.firestore();

let ME = null, PLAN = {}, LOG = { done: [], loads: {} }, tab = "tr";

const $ = i => document.getElementById(i);
const today = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fone = t => String(t || "").replace(/\D/g, "").slice(-11);
const em = ph => ph + "@academia.app";
const pwAluno = (ph, pin) => "Tn@" + ph + "#" + pin + "#treino26";

auth.onAuthStateChanged(async u => {
  if (!u) { renderLogin(); return; }
  const s = await db.doc("users/" + u.uid).get();
  if (!s.exists) { auth.signOut(); return; }
  ME = { id: u.uid, ...s.data() };
  
  const [pSnap, lSnap] = await Promise.all([
    db.doc("plans/main").get(),
    db.doc("logs/" + ME.id + "_" + today()).get()
  ]);
  
  PLAN = pSnap.data() || {};
  if (lSnap.exists) LOG = lSnap.data();
  
  renderApp();
});

function renderLogin() {
  $("app").innerHTML = `
    <div class="card" style="margin-top:15vh; text-align:center;">
      <h1>🏋️ Treinô</h1>
      <p class="mut">Área do Aluno</p>
      
      <label>Telefone (com DDD)</label>
      <input id="lphone" type="tel" placeholder="11999998888" inputmode="tel">
      
      <label>PIN de 4 números</label>
      <input id="lpin" type="password" maxlength="4" inputmode="numeric" placeholder="••••">
      
      <button class="btn" onclick="fazerLogin()">Entrar no Treino</button>
    </div>
  `;
}

async function fazerLogin() {
  const ph = fone($("lphone").value), pin = $("lpin").value.trim();
  if (ph.length < 10 || !/^\d{4}$/.test(pin)) return alert("Insira o telefone correto e o PIN de 4 números.");

  try {
    await auth.signInWithEmailAndPassword(em(ph), pwAluno(ph, pin));
  } catch (e) {
    alert("Telefone ou PIN incorretos.");
  }
}

function sair() {
  auth.signOut();
}

async function renderApp() {
  const T = [["tr", "Treino"], ["per", "Meu Perfil"]];
  $("app").innerHTML = `
    <h1><span>🔥 ${esc(ME.nome)}</span><button class="lnk" onclick="sair()">Sair</button></h1>
    <nav>${T.map(t => `<button class="${t[0] === tab ? "on" : ""}" onclick="tab='${t[0]}';renderApp()">${t[1]}</button>`).join("")}</nav>
    <div id="v"></div>
  `;
  
  if (tab === "tr") vTreinoAluno();
  else vPerfilAluno();
}

async function vTreinoAluno() {
  const tAtual = ME.hoje || "A";
  const exercicios = PLAN[tAtual] || [];

  $("v").innerHTML = `
    <div class="card">
      <h2>Escolher Treino do Dia</h2>
      <div class="row">
        ${["A", "B", "C", "D", "E"].map(x => `<button class="btn" style="margin-top:0; background:${x === tAtual ? 'var(--pri-gradient)' : 'var(--card-bg)'}; border:1px solid var(--card-border);" onclick="mudarTreino('${x}')">${x}</button>`).join("")}
      </div>
    </div>

    <div class="card">
      <h2>Treino ${tAtual}</h2>
      ${exercicios.length ? exercicios.map(e => {
        const feito = LOG.done.includes(e.id);
        const carga = LOG.loads[e.id] || "";
        return `
          <div class="item" style="flex-direction:column; align-items:flex-start;">
            <div style="display:flex; width:100%; justify-content:space-between; align-items:center;">
              <div>
                <b>${esc(e.n)}</b>
                <div class="mut">${esc(e.g)} ·${esc(e.s)}x${esc(e.r)}${e.gif ? ' · <a href="' + esc(e.gif) + '" target="_blank" style="color:var(--pri)">GIF</a>' : ''}</div>
              </div>
              <input type="checkbox" class="check-box" ${feito ? "checked" : ""} onclick="toggleEx('${e.id}')">
            </div>
            <div style="width:100%; margin-top:8px; display:flex; gap:8px; align-items:center;">
              <input type="text" placeholder="Carga (ex: 20kg)" value="${esc(carga)}" onchange="salvarCarga('${e.id}', this.value)" style="padding:8px 10px; font-size:13px;">
            </div>
          </div>
        `;
      }).join("") : '<div class="mut">Nenhum exercício cadastrado para este treino ainda.</div>'}
    </div>
  `;
}

async function mudarTreino(t) {
  ME.hoje = t;
  await db.doc("users/" + ME.id).update({ hoje: t });
  renderApp();
}

async function toggleEx(id) {
  if (LOG.done.includes(id)) {
    LOG.done = LOG.done.filter(x => x !== id);
  } else {
    LOG.done.push(id);
  }
  await salvarLogFirebase();
  renderApp();
}

async function salvarCarga(id, val) {
  LOG.loads = LOG.loads || {};
  LOG.loads[id] = val;
  await salvarLogFirebase();
}

async function salvarLogFirebase() {
  const idLog = ME.id + "_" + today();
  await db.doc("logs/" + idLog).set({
    uid: ME.id,
    date: today(),
    done: LOG.done,
    loads: LOG.loads
  }, { merge: true });
}

function vPerfilAluno() {
  $("v").innerHTML = `
    <div class="card">
      <h2>Meus Dados & Metas</h2>
      <label>Peso Atual (kg)</label>
      <input id="p-peso" type="number" value="${ME.peso || ""}">
      
      <label>Altura (cm)</label>
      <input id="p-alt" type="number" value="${ME.alt || ""}">
      
      <label>Idade</label>
      <input id="p-idade" type="number" value="${ME.idade || ""}">
      
      <label>Objetivo</label>
      <select id="p-obj">
        <option value="perder" ${ME.obj === 'perder' ? 'selected' : ''}>Perder Peso / Definir</option>
        <option value="ganhar" ${ME.obj === 'ganhar' ? 'selected' : ''}>Ganhar Massa Muscular</option>
      </select>
      
      <label>Dias de treino por semana</label>
      <input id="p-dias" type="number" value="${ME.dias || "4"}">
      
      <button class="btn" onclick="salvarPerfil()">Salvar Perfil</button>
      <button class="btn" style="background:var(--card-bg); border:1px solid var(--card-border); margin-top:10px;" onclick="instalarAppPWA()">📲 Instalar App no Telemóvel</button>
    </div>
  `;
}

async function salvarPerfil() {
  const peso = parseFloat($("p-peso").value);
  const alt = parseInt($("p-alt").value);
  const idade = parseInt($("p-idade").value);
  const obj = $("p-obj").value;
  const dias = parseInt($("p-dias").value);

  if (!peso || !alt || !idade) return alert("Preencha todos os campos corretamente.");

  ME.peso = peso;
  ME.alt = alt;
  ME.idade = idade;
  ME.obj = obj;
  ME.dias = dias;

  await db.doc("users/" + ME.id).update({ peso, alt, idade, obj, dias });
  alert("Perfil atualizado com sucesso!");
  renderApp();
}

function instalarAppPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('Utilizador aceitou instalar');
      }
      deferredPrompt = null;
    });
  } else {
    alert("Para instalar, toca nos 3 pontos do Chrome e escolhe 'Adicionar ao ecrã principal' ou 'Instalar aplicação'.");
  }
}
</script>
</body>
</html>
